<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Windsor Pro - Easy Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #ffffff;
        }
        input[type=range] {
            accent-color: #06b6d4;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">

        <!-- 1. MG WINDSOR PRO IMAGE HEADER -->
        <div class="bg-gradient-to-b from-cyan-950/60 to-slate-900 p-5 text-center relative">
            <span class="text-[11px] font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">
                MG Windsor EV Pro (52.9 kWh)
            </span>
            <h1 class="text-xl font-extrabold text-white mt-2">Car Performance Check</h1>

            <img src="https://imgd.aeplcdn.com/1280x720/n/cw/ec/186465/windsor-ev-exterior-right-front-three-quarter-21.jpeg?isig=0&q=80"
                 alt="MG Windsor EV Pro"
                 class="w-full h-44 object-contain my-2 rounded-xl"
                 onerror="this.style.display='none'">
        </div>

        <!-- 2. SIMPLE INPUTS -->
        <div class="p-5 space-y-4 border-t border-slate-800">

            <!-- Battery % Remaining -->
            <div class="bg-slate-800/70 p-4 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-bold text-slate-200">1. Battery Remaining (%)</label>
                    <span class="text-xl font-extrabold text-cyan-400"><span id="socShow">60</span>%</span>
                </div>
                <input type="range" id="socInput" min="1" max="99" value="60" class="w-full h-2 cursor-pointer">
                <p class="text-xs text-slate-400 mt-1">Battery Used from 100%: <strong id="usedShow" class="text-white">40%</strong></p>
            </div>

            <!-- Odometer Readings -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800/70 p-3.5 rounded-2xl">
                    <label class="text-xs font-bold text-slate-400 block mb-1">2. Previous Odo (km)</label>
                    <input type="number" id="prevOdo" value="1000"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-lg font-extrabold text-white focus:border-cyan-400 outline-none">
                </div>

                <div class="bg-slate-800/70 p-3.5 rounded-2xl">
                    <label class="text-xs font-bold text-slate-400 block mb-1">3. Current Odo (km)</label>
                    <input type="number" id="currOdo" value="1160"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-lg font-extrabold text-white focus:border-cyan-400 outline-none">
                </div>
            </div>

            <!-- Amount Spent on Charging -->
            <div class="bg-slate-800/70 p-3.5 rounded-2xl">
                <label class="text-xs font-bold text-slate-400 block mb-1">4. Charging Money Spent (₹)</label>
                <input type="number" id="moneySpent" value="200"
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-lg font-extrabold text-emerald-400 focus:border-cyan-400 outline-none">
            </div>

        </div>

        <!-- 3. EASY VISUAL PERFORMANCE RESULTS -->
        <div class="p-5 bg-slate-950/80 border-t border-slate-800 space-y-4">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Your Car Result</span>
                <span id="statusBadge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400">
                    ✅ Good Performance
                </span>
            </div>

            <!-- Visual Range Bar -->
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <div class="flex justify-between text-xs font-bold mb-1.5">
                    <span class="text-cyan-400">Driven: <span id="kmDriven">160</span> km</span>
                    <span class="text-emerald-400">Can Go More: <span id="kmLeft">240</span> km</span>
                </div>
                <!-- Visual Progress Bar -->
                <div class="w-full h-4 bg-slate-800 rounded-full overflow-hidden flex">
                    <div id="barDriven" class="bg-cyan-500 h-full transition-all duration-300" style="width: 40%"></div>
                    <div id="barLeft" class="bg-emerald-500/40 h-full transition-all duration-300" style="width: 60%"></div>
                </div>
                <div class="flex justify-between text-[11px] text-slate-400 mt-1.5">
                    <span>0 km</span>
                    <span>Total 100% Range: <strong id="fullRangeBarText" class="text-white">400 km</strong> (Claimed: 449 km)</span>
                </div>
            </div>

            <!-- 2 Big Main Result Boxes -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center">
                    <span class="text-xs text-slate-400 font-semibold block">100% Full Charge Range</span>
                    <span id="fullRangeBig" class="text-3xl font-extrabold text-white mt-1 block">400 <small class="text-sm font-normal text-slate-400">km</small></span>
                    <span class="text-[11px] text-cyan-400 mt-1 block"><span id="kmPerPct">4.0</span> km per 1%</span>
                </div>

                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-center">
                    <span class="text-xs text-slate-400 font-semibold block">Running Cost</span>
                    <span class="text-3xl font-extrabold text-emerald-400 mt-1 block">₹<span id="costPerKm">1.25</span> <small class="text-sm font-normal text-slate-400">/km</small></span>
                    <span class="text-[11px] text-slate-400 mt-1 block">Petrol Car: ~₹8.5/km</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const socInput = document.getElementById('socInput');
        const prevOdo = document.getElementById('prevOdo');
        const currOdo = document.getElementById('currOdo');
        const moneySpent = document.getElementById('moneySpent');

        function calculate() {
            const remPct = parseFloat(socInput.value) || 0;
            const usedPct = Math.max(1, 100 - remPct);

            const prev = parseFloat(prevOdo.value) || 0;
            const curr = parseFloat(currOdo.value) || 0;
            const driven = Math.max(1, curr - prev);

            const money = parseFloat(moneySpent.value) || 0;

            // Simple Math
            const kmPer1Pct = driven / usedPct;
            const totalFullRange = Math.round(kmPer1Pct * 100);
            const rangeRemaining = Math.round(kmPer1Pct * remPct);
            const costKm = money / driven;

            // Update Screen
            document.getElementById('socShow').innerText = remPct;
            document.getElementById('usedShow').innerText = usedPct + '%';

            document.getElementById('kmDriven').innerText = driven;
            document.getElementById('kmLeft').innerText = rangeRemaining;
            document.getElementById('fullRangeBarText').innerText = totalFullRange + ' km';
            document.getElementById('fullRangeBig').innerHTML = `${totalFullRange} <small class="text-sm font-normal text-slate-400">km</small>`;
            document.getElementById('kmPerPct').innerText = kmPer1Pct.toFixed(1);
            document.getElementById('costPerKm').innerText = costKm.toFixed(2);

            // Update Visual Bar
            document.getElementById('barDriven').style.width = usedPct + '%';
            document.getElementById('barLeft').style.width = remPct + '%';

            // Simple Status Badge
            const badge = document.getElementById('statusBadge');
            if (totalFullRange >= 380) {
                badge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400";
                badge.innerText = "🌟 Best Performance";
            } else if (totalFullRange >= 320) {
                badge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-cyan-500/20 text-cyan-400";
                badge.innerText = "✅ Normal Range";
            } else {
                badge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400";
                badge.innerText = "⚡ Low Range (High AC/Traffic)";
            }
        }

        [socInput, prevOdo, currOdo, moneySpent].forEach(el => el.addEventListener('input', calculate));
        calculate();
    </script>

</body>
</html>
