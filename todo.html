<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseTask - Modern Interactive To-Do List</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind Configuration for Dark Mode & Custom Fonts -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Smooth transitions for theme & elements */
    * {
      transition-property: background-color, border-color, color, fill, stroke, opacity, transform, box-shadow;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 200ms;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }
    .animate-slide-in {
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-fade-out {
      animation: fadeOut 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center justify-start py-10 px-4 sm:px-6">

  <!-- Main Container -->
  <div class="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-slate-950/50 border border-slate-100 dark:border-slate-800 p-6 sm:p-8 relative overflow-hidden">
    
    <!-- Header & Controls -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">PulseTask</h1>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-400">Pro</span>
        </div>
        <p id="date-display" class="text-sm text-slate-500 dark:text-slate-400 mt-1"></p>
      </div>

      <div class="flex items-center gap-3">
        <!-- Theme Toggle -->
        <button id="theme-toggle" aria-label="Toggle Theme" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <!-- Sun Icon -->
          <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <!-- Moon Icon -->
          <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
        </button>
      </div>
    </div>

    <!-- Quick Stats Cards -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800 rounded-2xl p-3.5 text-center">
        <span class="block text-xs font-medium text-slate-400 dark:text-slate-400 uppercase tracking-wider">Total</span>
        <span id="stat-total" class="text-xl font-bold text-slate-900 dark:text-white mt-0.5 block">0</span>
      </div>
      <div class="bg-emerald-50/50 dark:bg-emerald-950/20 border border-emerald-100/60 dark:border-emerald-900/30 rounded-2xl p-3.5 text-center">
        <span class="block text-xs font-medium text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">Done</span>
        <span id="stat-completed" class="text-xl font-bold text-emerald-700 dark:text-emerald-300 mt-0.5 block">0</span>
      </div>
      <div class="bg-amber-50/50 dark:bg-amber-950/20 border border-amber-100/60 dark:border-amber-900/30 rounded-2xl p-3.5 text-center">
        <span class="block text-xs font-medium text-amber-600 dark:text-amber-400 uppercase tracking-wider">Pending</span>
        <span id="stat-pending" class="text-xl font-bold text-amber-700 dark:text-amber-300 mt-0.5 block">0</span>
      </div>
    </div>

    <!-- Add Task Form -->
    <form id="todo-form" class="space-y-3 mb-6">
      <div class="relative">
        <input 
          type="text" 
          id="todo-input" 
          placeholder="What needs to be done today?" 
          autocomplete="off" 
          required
          class="w-full bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3.5 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-800 text-sm shadow-sm"
        />
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <!-- Due Date Picker -->
          <div class="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-600 dark:text-slate-300">
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <input type="date" id="date-input" class="bg-transparent focus:outline-none cursor-pointer font-medium" />
          </div>

          <!-- Priority Selector -->
          <div class="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1 text-xs font-medium">
            <button type="button" class="priority-btn px-2.5 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all" data-priority="low">Low</button>
            <button type="button" class="priority-btn px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm transition-all" data-priority="medium">Medium</button>
            <button type="button" class="priority-btn px-2.5 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all" data-priority="high">High</button>
          </div>
        </div>

        <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium text-sm shadow-md shadow-indigo-500/20 active:scale-95 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
          Add Task
        </button>
      </div>
    </form>

    <!-- Search & Filters Bar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-6">
      <!-- Search Input -->
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search tasks..." 
          class="w-full bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Filter Tabs -->
      <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-medium">
        <button type="button" class="filter-btn flex-1 sm:flex-none px-3 py-1.5 rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm" data-filter="all">All</button>
        <button type="button" class="filter-btn flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" data-filter="active">Active</button>
        <button type="button" class="filter-btn flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" data-filter="completed">Done</button>
      </div>
    </div>

    <!-- Batch Actions Bar -->
    <div class="flex items-center justify-between px-2 mb-3 text-xs text-slate-400 dark:text-slate-500 font-medium">
      <span id="task-count">0 items remaining</span>
      <div class="flex items-center gap-3">
        <button id="clear-completed" class="hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">Clear Completed</button>
        <span>•</span>
        <button id="clear-all" class="hover:text-rose-600 transition-colors">Clear All</button>
      </div>
    </div>

    <!-- Todo List Items Container -->
    <ul id="todo-list" class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1"></ul>

  </div>

  <!-- Toast Notification Container with Undo Support -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- JavaScript Application Logic -->
  <script>
    // State Management
    let todos = JSON.parse(localStorage.getItem('pulsetask_todos')) || [
      { id: '1', text: 'Explore the modern interactive features ✨', dueDate: new Date().toISOString().split('T')[0], priority: 'high', completed: false },
      { id: '2', text: 'Customize priority tags & due dates 📅', dueDate: '', priority: 'medium', completed: false }
    ];
    let currentFilter = 'all';
    let searchQuery = '';
    let selectedPriority = 'medium';
    let lastDeletedTask = null;
    let lastDeletedIndex = -1;

    // DOM Elements
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const dateInput = document.getElementById('date-input');
    const list = document.getElementById('todo-list');
    const searchInput = document.getElementById('search-input');
    const statTotal = document.getElementById('stat-total');
    const statCompleted = document.getElementById('stat-completed');
    const statPending = document.getElementById('stat-pending');
    const taskCountDisplay = document.getElementById('task-count');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const priorityBtns = document.querySelectorAll('.priority-btn');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const clearAllBtn = document.getElementById('clear-all');
    const headerDateDisplay = document.getElementById('date-display');

    // Date formatting
    headerDateDisplay.textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    // Theme Management
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    });

    // Priority Selection
    priorityBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        priorityBtns.forEach(b => {
          b.className = 'priority-btn px-2.5 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
        });
        btn.className = 'priority-btn px-2.5 py-1.5 rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm transition-all';
        selectedPriority = btn.dataset.priority;
      });
    });

    function saveTodos() {
      localStorage.setItem('pulsetask_todos', JSON.stringify(todos));
      updateStats();
    }

    function updateStats() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const pending = total - completed;

      statTotal.textContent = total;
      statCompleted.textContent = completed;
      statPending.textContent = pending;
      taskCountDisplay.textContent = `${pending} item${pending === 1 ? '' : 's'} remaining`;
    }

    function showToast(message, actionText, actionCallback) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center justify-between gap-4 bg-slate-900 dark:bg-slate-800 text-white px-4 py-3 rounded-2xl shadow-xl shadow-slate-950/20 border border-slate-800 dark:border-slate-700 text-xs animate-slide-in';
      
      const textSpan = document.createElement('span');
      textSpan.textContent = message;
      toast.appendChild(textSpan);

      if (actionText && actionCallback) {
        const actionBtn = document.createElement('button');
        actionBtn.className = 'font-semibold text-indigo-400 hover:text-indigo-300 underline uppercase tracking-wider text-[11px]';
        actionBtn.textContent = actionText;
        actionBtn.onclick = () => {
          actionCallback();
          toast.classList.add('animate-fade-out');
          setTimeout(() => toast.remove(), 200);
        };
        toast.appendChild(actionBtn);
      }

      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentElement) {
          toast.classList.add('animate-fade-out');
          setTimeout(() => toast.remove(), 200);
        }
      }, 4000);
    }

    function formatDateBadge(dateStr) {
      if (!dateStr) return null;
      const [year, month, day] = dateStr.split('-');
      const due = new Date(year, month - 1, day);
      const today = new Date();
      today.setHours(0,0,0,0);
      
      const diffDays = Math.round((due - today) / (1000 * 60 * 60 * 24));
      
      let label = due.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      let isOverdue = diffDays < 0;
      let isToday = diffDays === 0;

      return { label, isOverdue, isToday };
    }

    function renderTodos() {
      list.innerHTML = '';

      // Filter and Search logic
      const filtered = todos.filter(todo => {
        const matchesFilter = currentFilter === 'all' || 
                              (currentFilter === 'active' && !todo.completed) || 
                              (currentFilter === 'completed' && todo.completed);
        const matchesSearch = todo.text.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        const emptyLi = document.createElement('li');
        emptyLi.className = 'text-center py-12 text-slate-400 dark:text-slate-500 text-xs';
        emptyLi.innerHTML = `
          <svg class="w-10 h-10 mx-auto mb-3 opacity-40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
          No tasks found matching your criteria.
        `;
        list.appendChild(emptyLi);
        updateStats();
        return;
      }

      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = `group flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-100 dark:border-slate-800/80 hover:bg-slate-100/80 dark:hover:bg-slate-800/80 transition-all animate-slide-in ${todo.completed ? 'opacity-70' : ''}`;

        // Left Container (Checkbox + Text + Badges)
        const leftDiv = document.createElement('div');
        leftDiv.className = 'flex items-center gap-3 flex-1 min-w-0';

        // Checkbox
        const checkboxWrapper = document.createElement('label');
        checkboxWrapper.className = 'relative flex items-center justify-center cursor-pointer';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.className = 'peer sr-only';
        checkbox.onchange = () => toggleTodo(todo.id);

        const checkMarkBox = document.createElement('div');
        checkMarkBox.className = 'w-5 h-5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 peer-checked:bg-indigo-600 peer-checked:border-indigo-600 flex items-center justify-center transition-all';
        checkMarkBox.innerHTML = `<svg class="w-3.5 h-3.5 text-white scale-0 peer-checked:scale-100 transition-transform" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;

        checkboxWrapper.appendChild(checkbox);
        checkboxWrapper.appendChild(checkMarkBox);
        leftDiv.appendChild(checkboxWrapper);

        // Content
        const contentDiv = document.createElement('div');
        contentDiv.className = 'flex flex-col gap-1 min-w-0 flex-1';

        const textSpan = document.createElement('span');
        textSpan.className = `text-sm font-medium text-slate-800 dark:text-slate-200 truncate transition-all ${todo.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}`;
        textSpan.textContent = todo.text;
        contentDiv.appendChild(textSpan);

        // Meta Tags Row (Priority + Date)
        const metaRow = document.createElement('div');
        metaRow.className = 'flex items-center gap-2 flex-wrap';

        // Priority Badge
        const priorityColors = {
          high: 'bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 border-rose-100 dark:border-rose-900/30',
          medium: 'bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 border-amber-100 dark:border-amber-900/30',
          low: 'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border-emerald-100 dark:border-emerald-900/30'
        };
        const priorityBadge = document.createElement('span');
        priorityBadge.className = `px-2 py-0.5 rounded-md text-[10px] font-semibold border uppercase tracking-wider ${priorityColors[todo.priority] || priorityColors.medium}`;
        priorityBadge.textContent = todo.priority;
        metaRow.appendChild(priorityBadge);

        // Date Badge
        if (todo.dueDate) {
          const dateInfo = formatDateBadge(todo.dueDate);
          if (dateInfo) {
            const dateBadge = document.createElement('span');
            let dateBadgeStyle = 'bg-slate-100 dark:bg-slate-700/60 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700';
            if (dateInfo.isOverdue && !todo.completed) {
              dateBadgeStyle = 'bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-900 font-semibold';
            } else if (dateInfo.isToday && !todo.completed) {
              dateBadgeStyle = 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-900 font-semibold';
            }
            dateBadge.className = `px-2 py-0.5 rounded-md text-[10px] border flex items-center gap-1 ${dateBadgeStyle}`;
            dateBadge.innerHTML = `📅 ${dateInfo.isToday ? 'Today' : dateInfo.label} ${dateInfo.isOverdue && !todo.completed ? '(Overdue)' : ''}`;
            metaRow.appendChild(dateBadge);
          }
        }

        contentDiv.appendChild(metaRow);
        leftDiv.appendChild(contentDiv);
        li.appendChild(leftDiv);

        // Delete Button
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'opacity-0 group-hover:opacity-150 p-2 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-all';
        deleteBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
        deleteBtn.onclick = () => deleteTodo(todo.id);
        li.appendChild(deleteBtn);

        list.appendChild(li);
      });

      updateStats();
    }

    function addTodo(text, dueDate, priority) {
      const newTodo = {
        id: Date.now().toString(),
        text: text.trim(),
        dueDate: dueDate || '',
        priority: priority || 'medium',
        completed: false
      };
      todos.unshift(newTodo);
      saveTodos();
      renderTodos();
      showToast('Task added successfully!');
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        saveTodos();
        renderTodos();

        if (todo.completed) {
          showToast('Task marked as completed!');
          // Check if all tasks are completed for confetti celebration
          if (todos.length > 0 && todos.every(t => t.completed)) {
            triggerConfetti();
          }
        }
      }
    }

    function deleteTodo(id) {
      const index = todos.findIndex(t => t.id === id);
      if (index !== -1) {
        lastDeletedTask = todos[index];
        lastDeletedIndex = index;
        todos.splice(index, 1);
        saveTodos();
        renderTodos();
        showToast('Task deleted', 'Undo', () => {
          if (lastDeletedTask) {
            todos.splice(lastDeletedIndex, 0, lastDeletedTask);
            saveTodos();
            renderTodos();
            showToast('Task restored!');
          }
        });
      }
    }

    function triggerConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Event Listeners
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (input.value.trim()) {
        addTodo(input.value, dateInput.value, selectedPriority);
        input.value = '';
        dateInput.value = '';
      }
    });

    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value;
      renderTodos();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.className = 'filter-btn flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white');
        btn.className = 'filter-btn flex-1 sm:flex-none px-3 py-1.5 rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm';
        currentFilter = btn.dataset.filter;
        renderTodos();
      });
    });

    clearCompletedBtn.addEventListener('click', () => {
      const count = todos.filter(t => t.completed).length;
      if (count === 0) return;
      todos = todos.filter(t => !t.completed);
      saveTodos();
      renderTodos();
      showToast(`Cleared ${count} completed task(s)`);
    });

    clearAllBtn.addEventListener('click', () => {
      if (todos.length === 0) return;
      todos = [];
      saveTodos();
      renderTodos();
      showToast('All tasks cleared');
    });

    // Initial Render
    renderTodos();
  </script>
</body>
</html>
